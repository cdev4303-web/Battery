<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>চার্জিং সহকারী - Android Charging Assistant</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="description" content="বাংলা অ্যান্ড্রয়েড চার্জিং সহকারী ও ব্যাটারি হেলথ মনিটর। ব্যাকগ্রাউন্ড সার্ভিস ও ভয়েস অ্যালার্ট।" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="চার্জিং সহকারী" />
    <meta name="application-name" content="চার্জিং সহকারী" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate icon" type="image/png" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" href="./pwa-192x192.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Google Fonts: Hind Siliguri for beautiful Bengali rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans select-none overflow-x-hidden min-h-screen" style="background-color: #020617; color: #f8fafc;">
    <div id="root">
      <!-- Instant Fallback UI to prevent white screen flash before React hydrates -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: 'Hind Siliguri', sans-serif;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #10b981, #0f766e); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4); margin-bottom: 16px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#fde047" stroke="#fde047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff;">চার্জিং সহকারী</div>
        <div style="font-size: 13px; color: #94a3b8; margin-top: 6px;">সিস্টেম প্রস্তুত করা হচ্ছে...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
