<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="mBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="70%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="mBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="mBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Full background for maskable -->
  <rect width="512" height="512" fill="url(#mBg)"/>

  <!-- Battery Terminal -->
  <rect x="224" y="90" width="64" height="24" rx="6" fill="#cbd5e1"/>

  <!-- Battery Body in Safe Zone (scaled to fit within 400x400 safe area) -->
  <rect x="160" y="110" width="192" height="290" rx="30" fill="url(#mBody)" stroke="#334155" stroke-width="4"/>
  <rect x="174" y="124" width="164" height="262" rx="20" fill="#091e1d"/>
  <rect x="178" y="180" width="156" height="202" rx="16" fill="url(#mGlass)"/>

  <!-- Lightning Bolt -->
  <polygon points="270,170 216,266 254,266 240,344 304,242 266,242" fill="url(#mBolt)" stroke="#fef08a" stroke-width="2"/>
</svg>
